# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-lamlx"
BBFILE_PATTERN_meta-lamlx = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-lamlx = "6"

LAYERDEPENDS_meta-lamlx = "core"
LAYERSERIES_COMPAT_meta-lamlx = "scarthgap"
