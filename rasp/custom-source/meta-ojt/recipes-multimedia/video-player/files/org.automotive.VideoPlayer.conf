<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  D-Bus system bus policy for the Video Player.
  Installed to /usr/share/dbus-1/system.d/
-->
<busconfig>
  <!-- only root (our systemd service) may own the name -->
  <policy user="root">
    <allow own="org.automotive.VideoPlayer"/>
  </policy>

  <!-- everyone (GUI, CAN service, gdbus test) may call methods and receive signals -->
  <policy context="default">
    <allow send_destination="org.automotive.VideoPlayer"/>
    <allow receive_sender="org.automotive.VideoPlayer"/>
  </policy>
</busconfig>
