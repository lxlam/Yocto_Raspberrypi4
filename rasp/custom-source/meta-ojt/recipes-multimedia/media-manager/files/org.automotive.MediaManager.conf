<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  D-Bus system bus policy for the Media Manager.
  Installed to /usr/share/dbus-1/system.d/
  Without this file the daemon cannot own the name on the system bus.
-->
<busconfig>
  <!-- only root (our systemd service) may own the name -->
  <policy user="root">
    <allow own="org.automotive.MediaManager"/>
  </policy>

  <!-- everyone (Player Core, GUI, gdbus test) may call methods and receive signals -->
  <policy context="default">
    <allow send_destination="org.automotive.MediaManager"/>
    <allow receive_sender="org.automotive.MediaManager"/>
  </policy>
</busconfig>
